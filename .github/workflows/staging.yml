name: Deployment To Staging

on:
    push:
        branches: 
            - main

env:
  IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/front-session16
  VITE_API_URL: https://api.session16.lebondeveloppeur.net

jobs:
    unit-test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
            
            - name: install dep
              run: npm i

            - name: run test ${{ secrets.DOCKERHUB_TOKEN }}
              run: npm run test
    
    sonarqube-code-quality-scan-job:
        runs-on: ubuntu-latest
        steps:
          - name: Clone Source Code
            uses: actions/checkout@v4

          - name: Set up Node.js
            uses: actions/setup-node@v3
            with:
              node-version: '18'

          - name: Install dependencies
            run: npm install

          - name: SonarQube Scan
            uses: sonarsource/sonarqube-scan-action@master
            env:
              SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    
    grype-scan:
        runs-on: ubuntu-latest
        needs: [unit-test, sonarqube-code-quality-scan-job]
        steps:
          - name: Checkout code
            uses: actions/checkout@v6

          - name: build docker image
            run: docker build -t ${{env.IMAGE_NAME}} --build-arg VITE_API_URL=${{env.VITE_API_URL}} .

          - name: Scan image
            uses: anchore/scan-action@v7
            with:
              image: ${{env.IMAGE_NAME}}
              fail-build: true
              severity-cutoff: critical

    snyk-code-security-scan-job:
        runs-on: ubuntu-latest
        needs: [unit-test, sonarqube-code-quality-scan-job]
        steps:
          - name: Checkout Code
            uses: actions/checkout@v4

          - name: Install Dependency Scanning Tool (Snyk)
            run: npm install -g snyk

          - name: Snyk Authentication
            run: snyk auth ${{ secrets.SNYK_TOKEN }}

          - name: Post a message in a channel
            uses: slackapi/slack-github-action@v2.1.1
            with:
              webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
              webhook-type: incoming-webhook
              payload: |
                text: "*GitHub Action build result*: ${{ job.status }}\n${{ github.event.pull_request.html_url || github.event.head_commit.url }}"
                blocks:
                  - type: "section"
                    text:
                      type: "mrkdwn"
                      text: "GitHub Action build result: ${{ job.status }}\n${{ github.event.pull_request.html_url || github.event.head_commit.url }}"

          - name: Run Snyk Vulnerability Scan
            run: snyk monitor --all-projects --org=talel12 --severity-threshold=medium

          - name: Run Snyk Vulnerability Scan
            run: snyk test --all-projects --org=talel12 --severity-threshold=medium
        
          
    build-and-push:
        runs-on: ubuntu-latest
        needs:  snyk-code-security-scan-job
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: build docker image
              run: docker build -t ${{env.IMAGE_NAME}} --build-arg VITE_API_URL=${{env.VITE_API_URL}} .

            - name: tag image by version
              run: docker tag ${{env.IMAGE_NAME}} ${{env.IMAGE_NAME}}:v${{github.run_number}}

            - name: docker login
              uses: docker/login-action@v3
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}
            
            - name: push image to dockerhub
              run: docker push ${{env.IMAGE_NAME}}:v${{github.run_number}}

            - name: push image to dockerhub
              run: docker push ${{env.IMAGE_NAME}}

    Deploy:
        runs-on: ubuntu-latest
        needs: build-and-push
        steps:
          - uses: appleboy/ssh-action@v1
            with:
                host: ${{ secrets.VPS_HOST }}
                username: ${{ secrets.VPS_USERNAME }}
                password: ${{ secrets.VPS_PASSWORD }}
                script: |
                    cd /home/user/devops-script/frontend
                    sudo docker compose pull
                    sudo docker compose up -d --force-recreate

    notify-slack:
      runs-on: ubuntu-latest
      needs:
        - unit-test
        - sonarqube-code-quality-scan-job
        - grype-scan
        - snyk-code-security-scan-job
        - build-and-push
        - Deploy
      if: always()

      steps:
        - name: Send Slack Notification
          uses: slackapi/slack-github-action@v2.1.1
          with:
            webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
            webhook-type: incoming-webhook
            payload: |
              text: "Deployment Pipeline Result"
              blocks:
                - type: header
                  text:
                    type: plain_text
                    text: "🚀 Frontend Deployment Pipeline"

                - type: section
                  text:
                    type: mrkdwn
                    text: |
                      *Repository:* ${{ github.repository }}
                      *Branch:* ${{ github.ref_name }}
                      *Run:* #${{ github.run_number }}

                - type: section
                  fields:
                    - type: mrkdwn
                      text: "*Unit Tests:* ${{ needs.unit-test.result }}"
                    - type: mrkdwn
                      text: "*SonarQube:* ${{ needs.sonarqube-code-quality-scan-job.result }}"
                    - type: mrkdwn
                      text: "*Grype Scan:* ${{ needs.grype-scan.result }}"
                    - type: mrkdwn
                      text: "*Snyk Scan:* ${{ needs.snyk-code-security-scan-job.result }}"
                    - type: mrkdwn
                      text: "*Build & Push:* ${{ needs.build-and-push.result }}"
                    - type: mrkdwn
                      text: "*Deployment:* ${{ needs.Deploy.result }}"

                - type: section
                  text:
                    type: mrkdwn
                    text: "*Workflow URL:* https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"